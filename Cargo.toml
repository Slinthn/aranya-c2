[package]
name = "AranyaC2"
edition = "2024"

[dependencies]
aranya_runtime = { package = "aranya-runtime", path = "aranya-core/crates/aranya-runtime", features = ["libc"] }
aranya_policy_ifgen_build = { package = "aranya-policy-ifgen-build", path = "aranya-core/crates/aranya-policy-ifgen-build" }
aranya_crypto = { package = "aranya-crypto", path = "aranya-core/crates/aranya-crypto", features = ["alloc", "fs-keystore", "memstore", "afc", "clone-aead"] }
aranya_policy_module = { package = "aranya-policy-module", path = "aranya-core/crates/aranya-policy-module" }
aranya_policy_lang = { package = "aranya-policy-lang", path = "aranya-core/crates/aranya-policy-lang" }
aranya_policy_compiler = { package = "aranya-policy-compiler", path = "aranya-core/crates/aranya-policy-compiler" }
aranya_policy_vm = { package = "aranya-policy-vm", path = "aranya-core/crates/aranya-policy-vm" }
aranya_envelope_ffi = { package = "aranya-envelope-ffi", path = "aranya-core/crates/aranya-envelope-ffi" }
aranya_device_ffi = { package = "aranya-device-ffi", path = "aranya-core/crates/aranya-device-ffi" }
aranya_crypto_ffi = { package = "aranya-crypto-ffi", path = "aranya-core/crates/aranya-crypto-ffi" }
aranya_idam_ffi = { package = "aranya-idam-ffi", path = "aranya-core/crates/aranya-idam-ffi" }
aranya_perspective_ffi = { package = "aranya-perspective-ffi", path = "aranya-core/crates/aranya-perspective-ffi" }
aranya_model = { package = "aranya-model", path = "aranya-core/crates/aranya-model" }
aranya_quic_syncer = { package = "aranya-quic-syncer", path = "aranya-core/crates/aranya-quic-syncer" }
aranya_policy_text = { package = "aranya-policy-text", path = "aranya-core/crates/aranya-policy-text" }
aranya_policy_ifgen = { package = "aranya-policy-ifgen", path = "aranya-core/crates/aranya-policy-ifgen" }
aranya_fast_channels = { package = "aranya-fast-channels", path = "aranya-core/crates/aranya-fast-channels", features = ["alloc", "posix"] }
aranya-afc-util = { package = "aranya-afc-util", path = "aranya-core/crates/aranya-afc-util", features = ["alloc"] }
aranya-libc = { package = "aranya-libc", path = "aranya-core/crates/aranya-libc" }

rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
tokio = { version = "1.49.0", features = ["sync", "rt-multi-thread"] }
s2n-quic = { version = "1.72.0" }
serde = "1.0.228"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
dns-lookup = "3.0.1"
chrono = "0.4.44"
rand = "0.10.0"
bytes = "1.11.1"
postcard = "1.1.3"
heapless = "0.8.0"
rustix = "0.38.44"
clap = { version = "4.6.0", features = ["derive"] }
serde_yaml = "0.9.34"

[[bin]]
name = "operator"
path = "src/main_operator.rs"

[[bin]]
name = "infected"
path = "src/main_infected.rs"

[[bin]]
name = "setup"
path = "src/setup.rs"

[workspace]
members = [
    "crates/*"
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
authors = ["Alex Ringhoffer"]
license = "AGPL-3.0-only"
repository = "https://github.com/slinthn/aranya-c2"

[workspace.dependencies]
aranya-runtime = {version = "0.22.0", features = ["libc"] }
aranya-policy-ifgen-build = "0.15.0"
aranya-crypto = { version = "0.14.0", features = ["alloc", "fs-keystore", "memstore", "afc", "clone-aead"] }
aranya-policy-module = "0.20.0"
aranya-policy-lang = "0.14.1"
aranya-policy-compiler = "0.22.0"
aranya-policy-vm = "0.21.0"
aranya-envelope-ffi = "0.21.0"
aranya-device-ffi = "0.21.0"
aranya-crypto-ffi = "0.21.0" 
aranya-idam-ffi = "0.21.0"
aranya-perspective-ffi = "0.21.0"
aranya-policy-text = "0.1.4"
aranya-policy-ifgen = "0.22.0"
aranya-libc = "0.4.0"

rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
tokio = { version = "1.49.0", features = ["sync", "rt-multi-thread"] }
s2n-quic = { version = "1.72.0" }
serde = "1.0.228"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
dns-lookup = "3.0.1"
chrono = "0.4.44"
rand = "0.10.0"
bytes = "1.11.1"
postcard = "1.1.3"
heapless = "0.8.0"
rustix = "0.38.44"
clap = { version = "4.6.0", features = ["derive"] }
serde_yaml = "0.9.34"
rsa = { version = "0.9.10", features = ["sha2"] }
aes = "0.8.4"
aes-gcm = "0.10.3"
ratatui = "0.30.0"
dirs = "6.0.0"
tui-input = "0.15.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
base64 = "0.22.1"
machine-uid = "0.5.4"
hex = "0.4.3"
